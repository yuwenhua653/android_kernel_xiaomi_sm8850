name: Import verified Myron source history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-myron-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'yuwenhua653/android_kernel_xiaomi_sm8850'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Import exact source branch with history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --bare source.git
          cd source.git
          git fetch --no-tags https://github.com/yuwenhua653/oppo_oplus_realme_sm8850.git refs/heads/myron/native-kbuild
          test "$(git rev-parse FETCH_HEAD)" = '3bc662f2695f21c7c4047826cd65b9a60d5408f9'
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = 'd79dcafd6767e7102a636cce04cf3a24cb60a1f4'
          git fsck --connectivity-only
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push https://github.com/yuwenhua653/android_kernel_xiaomi_sm8850.git FETCH_HEAD:refs/heads/lineage-24.0 FETCH_HEAD:refs/heads/myron/native-kbuild
          printf 'Imported commit: %s\nVerified tree: %s\n' '3bc662f2695f21c7c4047826cd65b9a60d5408f9' 'd79dcafd6767e7102a636cce04cf3a24cb60a1f4' >> "$GITHUB_STEP_SUMMARY"
